<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docs RAG Chatbot</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --line: #e4e4df; --accent: #2f5bd3; --accent-soft: #e9eefb; --warn: #9a6700;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1f1f1d; --text: #ecece8; --muted: #9d9d97;
      --line: #33332f; --accent: #7f9ef0; --accent-soft: #252d44; --warn: #e3b341;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px;
          display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
  @media (max-width: 800px) { .wrap { grid-template-columns: 1fr; } }
  header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
  .badge.demo { color: var(--warn); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  .drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 18px; text-align: center;
          color: var(--muted); cursor: pointer; }
  .drop.over { border-color: var(--accent); color: var(--accent); }
  ul.docs { list-style: none; padding: 0; margin: 14px 0 0; }
  ul.docs li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
  ul.docs li label { flex: 1; min-width: 0; cursor: pointer; }
  .fname { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: 12px; color: var(--muted); }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
           background: var(--panel); color: var(--text); padding: 6px 10px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.x { border: none; color: var(--muted); padding: 2px 6px; }
  button:disabled { opacity: .5; cursor: default; }
  .chat { display: flex; flex-direction: column; min-height: 70vh; }
  .log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-bottom: 12px; }
  .msg { max-width: 90%; }
  .msg.user { align-self: flex-end; background: var(--accent-soft); padding: 8px 12px; border-radius: 10px; }
  .msg.bot .text { white-space: pre-wrap; }
  .msg.bot sup a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .cites { margin-top: 8px; display: grid; gap: 6px; }
  .cite { font-size: 13px; border-left: 3px solid var(--accent); padding: 4px 10px; background: var(--bg); border-radius: 0 6px 6px 0; }
  .cite a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .cite .snip { color: var(--muted); }
  .mode { font-size: 12px; color: var(--muted); margin-top: 4px; }
  form.ask { display: flex; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
  form.ask input { flex: 1; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
                   background: var(--bg); color: var(--text); }
  .hint { color: var(--muted); font-size: 13px; }
  .hint button { font-size: 13px; margin: 4px 4px 0 0; }
  .err { color: #c0392b; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Docs RAG Chatbot</h1>
    <span id="status" class="badge">loading…</span>
  </header>

  <aside class="panel">
    <h2>Documents</h2>
    <div id="drop" class="drop">Drop PDFs here or click to upload</div>
    <input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>
    <div id="uploadMsg" class="meta"></div>
    <ul id="docs" class="docs"></ul>
    <p class="meta">Tick documents to limit the search. Nothing ticked means all of them.</p>
  </aside>

  <main class="panel chat">
    <div id="log" class="log">
      <div class="hint">Ask a question about your documents. Try:<br>
        <button data-q="How many days of paid time off do employees get?">PTO days</button>
        <button data-q="What is the API rate limit?">API rate limit</button>
        <button data-q="How quickly must a security incident be reported?">Incident reporting</button>
      </div>
    </div>
    <form id="ask" class="ask">
      <input id="q" placeholder="Ask about your PDFs…" autocomplete="off" maxlength="1000" required>
      <button class="primary" id="send">Ask</button>
    </form>
  </main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  if (r.status === 204) return null;
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || `Request failed (${r.status})`);
  return body;
}

async function loadStatus() {
  const h = await api("/health");
  const el = $("#status");
  el.textContent = h.demo_mode ? "Demo mode: extractive answers, no API key" : `LLM: ${h.llm}`;
  el.classList.toggle("demo", h.demo_mode);
}

async function loadDocs() {
  const docs = await api("/documents");
  $("#docs").innerHTML = docs.map((d) => `
    <li>
      <input type="checkbox" id="d-${d.id}" value="${d.id}">
      <label for="d-${d.id}">
        <span class="fname" title="${esc(d.filename)}">${esc(d.filename)}</span>
        <span class="meta">${d.num_pages} pages · ${d.num_chunks} chunks</span>
      </label>
      <button class="x" title="Delete" data-del="${d.id}">✕</button>
    </li>`).join("") || '<li class="meta">No documents yet.</li>';
}

async function upload(files) {
  const msg = $("#uploadMsg");
  for (const f of files) {
    msg.textContent = `Indexing ${f.name}…`;
    const fd = new FormData();
    fd.append("file", f);
    try {
      const r = await api("/documents", { method: "POST", body: fd });
      msg.textContent = r.duplicate ? `${f.name} was already uploaded.` : `Indexed ${f.name}.`;
    } catch (e) {
      msg.textContent = `${f.name}: ${e.message}`;
    }
  }
  loadDocs(); loadStatus();
}

function renderAnswer(r) {
  const byN = Object.fromEntries(r.citations.map((c) => [c.n, c]));
  const link = (c) => `/documents/${c.doc_id}/file#page=${c.page}`;
  const text = esc(r.answer).replace(/\[(\d+)\]/g, (m, n) =>
    byN[n] ? `<sup><a href="${link(byN[n])}" target="_blank" title="${esc(byN[n].filename)} p.${byN[n].page}">[${n}]</a></sup>` : m);
  const cites = r.citations.map((c) => `
    <div class="cite"><a href="${link(c)}" target="_blank">[${c.n}] ${esc(c.filename)}, page ${c.page}</a>
      <div class="snip">${esc(c.snippet)}${c.snippet.length >= 280 ? "…" : ""}</div></div>`).join("");
  const mode = !r.citations.length ? "" : { demo: "Demo mode: quoted from your documents", fallback: "LLM unavailable, so this answer is quoted from your documents", groq: "" }[r.mode];
  return `<div class="text">${text}</div>${cites ? `<div class="cites">${cites}</div>` : ""}${mode ? `<div class="mode">${mode}</div>` : ""}`;
}

function add(cls, html) {
  const d = document.createElement("div");
  d.className = `msg ${cls}`;
  d.innerHTML = html;
  $("#log").appendChild(d);
  d.scrollIntoView({ behavior: "smooth", block: "end" });
  return d;
}

async function ask(question) {
  add("user", esc(question));
  const bot = add("bot", '<span class="meta">Thinking…</span>');
  $("#send").disabled = true;
  const doc_ids = [...document.querySelectorAll("#docs input:checked")].map((i) => i.value);
  try {
    const r = await api("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, doc_ids: doc_ids.length ? doc_ids : null }),
    });
    bot.innerHTML = renderAnswer(r);
  } catch (e) {
    bot.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  } finally {
    $("#send").disabled = false;
  }
}

$("#ask").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = $("#q").value.trim();
  if (q) { $("#q").value = ""; ask(q); }
});
$("#log").addEventListener("click", (e) => { const q = e.target.dataset?.q; if (q) ask(q); });
$("#docs").addEventListener("click", async (e) => {
  const id = e.target.dataset?.del;
  if (!id) return;
  await api(`/documents/${id}`, { method: "DELETE" });
  loadDocs(); loadStatus();
});
const drop = $("#drop");
drop.addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", (e) => upload(e.target.files));
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); upload(e.dataTransfer.files); });

loadStatus(); loadDocs();
</script>
</body>
</html>
