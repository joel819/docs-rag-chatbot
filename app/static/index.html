<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Docs RAG Chatbot</title>
<style>
  :root {
    --paper: #fff4dc; --card: #fffdf7; --ink: #1c1b33; --muted: #6a6780;
    --orange: #ff6a3d; --mint: #36d6a0; --lemon: #ffd43b; --lilac: #c3b1ff; --sky: #8fd3ff;
    --shadow: 4px 4px 0 var(--ink);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); font: 15px/1.55 ui-rounded, "Trebuchet MS", system-ui, sans-serif;
    background-color: var(--paper);
    background-image: radial-gradient(var(--ink) 0.8px, transparent 0.8px);
    background-size: 22px 22px; background-position: 0 0;
    background-blend-mode: soft-light;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 16px 40px;
          display: grid; grid-template-columns: 310px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .logo { width: 46px; height: 46px; display: grid; place-items: center; font-size: 24px;
          background: var(--lemon); border: 3px solid var(--ink); border-radius: 14px;
          box-shadow: var(--shadow); transform: rotate(-6deg); }
  h1 { font: 800 30px/1 Georgia, "Times New Roman", serif; margin: 0; letter-spacing: -.5px; }
  h1 span { background: linear-gradient(transparent 58%, var(--mint) 58%); padding: 0 4px; }
  .badge { margin-left: auto; font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 99px;
           background: var(--mint); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); }
  .badge.demo { background: var(--lemon); }
  .panel { background: var(--card); border: 3px solid var(--ink); border-radius: 18px;
           padding: 18px; box-shadow: var(--shadow); }
  aside.panel { background: var(--sky); }
  aside .inner { background: var(--card); border: 2px solid var(--ink); border-radius: 12px; padding: 4px 12px; }
  h2 { font: 800 13px/1 ui-rounded, system-ui, sans-serif; text-transform: uppercase; letter-spacing: .12em;
       margin: 0 0 12px; }
  .drop { border: 3px dashed var(--ink); border-radius: 14px; padding: 18px 12px; text-align: center;
          font-weight: 700; background: var(--lemon); cursor: pointer; transition: transform .12s; }
  .drop:hover { transform: rotate(-1.2deg) scale(1.02); }
  .drop.over { background: var(--mint); transform: scale(1.04); }
  ul.docs { list-style: none; padding: 0; margin: 0; }
  ul.docs li { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 2px dotted var(--ink); }
  ul.docs li:last-child { border-bottom: 0; }
  ul.docs li label { flex: 1; min-width: 0; cursor: pointer; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--orange); }
  .fname { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
  .meta { font-size: 12px; color: var(--muted); }
  #uploadMsg { margin: 8px 2px; font-weight: 600; color: var(--ink); }
  aside > .meta { margin: 12px 2px 0; color: var(--ink); }
  button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 12px; border: 2px solid var(--ink);
           background: var(--card); color: var(--ink); padding: 6px 12px; box-shadow: 2px 2px 0 var(--ink);
           transition: transform .08s, box-shadow .08s; }
  button:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
  button:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  button.primary { background: var(--orange); color: #fff; padding: 10px 22px; font-size: 16px; }
  button.x { border: none; box-shadow: none; background: none; color: var(--muted); padding: 2px 6px; }
  button.x:hover { color: var(--orange); transform: none; box-shadow: none; }
  button:disabled { opacity: .5; cursor: default; }
  .chat { display: flex; flex-direction: column; min-height: 72vh; }
  .log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding: 4px 4px 14px; }
  .msg { max-width: 92%; }
  .msg.user { align-self: flex-end; background: var(--lilac); border: 2px solid var(--ink); font-weight: 600;
              padding: 9px 14px; border-radius: 16px 16px 4px 16px; box-shadow: 3px 3px 0 var(--ink); }
  .msg.bot { background: #fff; border: 2px solid var(--ink); padding: 12px 14px;
             border-radius: 16px 16px 16px 4px; box-shadow: 3px 3px 0 var(--ink); }
  .msg.bot .text { white-space: pre-wrap; font-size: 16px; }
  .msg.bot sup a { background: var(--orange); color: #fff; text-decoration: none; font-weight: 800;
                   padding: 1px 5px; border-radius: 6px; margin: 0 1px; }
  .cites { margin-top: 12px; display: grid; gap: 10px; }
  .cite { font-size: 13px; border: 2px solid var(--ink); padding: 8px 12px; background: var(--lemon);
          border-radius: 4px 12px 12px 12px; }
  .cite:nth-child(2n) { background: var(--mint); transform: rotate(.4deg); }
  .cite:nth-child(3n) { background: var(--sky); transform: rotate(-.4deg); }
  .cite a { color: var(--ink); font-weight: 800; }
  .cite .snip { margin-top: 2px; }
  .mode { font-size: 12px; color: var(--muted); margin-top: 8px; font-style: italic; }
  form.ask { display: flex; gap: 10px; padding-top: 14px; border-top: 3px solid var(--ink); }
  form.ask input { flex: 1; font: inherit; font-size: 16px; padding: 10px 14px; border-radius: 12px;
                   border: 3px solid var(--ink); background: #fff; color: var(--ink); outline: none; }
  form.ask input:focus { box-shadow: 0 0 0 4px var(--lemon); }
  .hint { font-weight: 600; }
  .hint button { font-size: 13px; margin: 8px 8px 0 0; background: var(--lilac); }
  .hint button:nth-child(odd) { background: var(--mint); }
  .err { color: #b3261e; font-weight: 700; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">📚</div>
    <h1>Ask your <span>docs</span></h1>
    <span id="status" class="badge">loading…</span>
  </header>

  <aside class="panel">
    <h2>Your documents</h2>
    <div id="drop" class="drop">Drop PDFs here<br><span class="meta" style="color:var(--ink)">or click to upload</span></div>
    <input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>
    <div id="uploadMsg" class="meta"></div>
    <div class="inner"><ul id="docs" class="docs"></ul></div>
    <p class="meta">Tick documents to limit the search. Nothing ticked means all of them.</p>
  </aside>

  <main class="panel chat">
    <div id="log" class="log">
      <div class="hint">Ask a question about your documents. Try:<br>
        <button data-q="How many days of paid time off do employees get?">PTO days</button>
        <button data-q="What is the API rate limit?">API rate limit</button>
        <button data-q="How quickly must a security incident be reported?">Incident reporting</button>
      </div>
    </div>
    <form id="ask" class="ask">
      <input id="q" placeholder="Ask about your PDFs…" autocomplete="off" maxlength="1000" required>
      <button class="primary" id="send">Ask</button>
    </form>
  </main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  if (r.status === 204) return null;
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || `Request failed (${r.status})`);
  return body;
}

async function loadStatus() {
  const h = await api("/health");
  const el = $("#status");
  el.textContent = h.demo_mode ? "Demo mode · quotes only" : `Live · ${h.llm}`;
  el.classList.toggle("demo", h.demo_mode);
}

async function loadDocs() {
  const docs = await api("/documents");
  $("#docs").innerHTML = docs.map((d) => `
    <li>
      <input type="checkbox" id="d-${d.id}" value="${d.id}">
      <label for="d-${d.id}">
        <span class="fname" title="${esc(d.filename)}">${esc(d.filename)}</span>
        <span class="meta">${d.num_pages} pages · ${d.num_chunks} chunks</span>
      </label>
      <button class="x" title="Delete" data-del="${d.id}">✕</button>
    </li>`).join("") || '<li class="meta">No documents yet.</li>';
}

async function upload(files) {
  const msg = $("#uploadMsg");
  for (const f of files) {
    msg.textContent = `Indexing ${f.name}…`;
    const fd = new FormData();
    fd.append("file", f);
    try {
      const r = await api("/documents", { method: "POST", body: fd });
      msg.textContent = r.duplicate ? `${f.name} was already uploaded.` : `Indexed ${f.name}.`;
    } catch (e) {
      msg.textContent = `${f.name}: ${e.message}`;
    }
  }
  loadDocs(); loadStatus();
}

function renderAnswer(r) {
  const byN = Object.fromEntries(r.citations.map((c) => [c.n, c]));
  const link = (c) => `/documents/${c.doc_id}/file#page=${c.page}`;
  const text = esc(r.answer).replace(/\[(\d+)\]/g, (m, n) =>
    byN[n] ? `<sup><a href="${link(byN[n])}" target="_blank" title="${esc(byN[n].filename)} p.${byN[n].page}">[${n}]</a></sup>` : m);
  const cites = r.citations.map((c) => `
    <div class="cite"><a href="${link(c)}" target="_blank">[${c.n}] ${esc(c.filename)}, page ${c.page}</a>
      <div class="snip">${esc(c.snippet)}${c.snippet.length >= 280 ? "…" : ""}</div></div>`).join("");
  const mode = !r.citations.length ? "" : { demo: "Demo mode: quoted from your documents", fallback: "LLM unavailable, so this answer is quoted from your documents", groq: "" }[r.mode];
  return `<div class="text">${text}</div>${cites ? `<div class="cites">${cites}</div>` : ""}${mode ? `<div class="mode">${mode}</div>` : ""}`;
}

function add(cls, html) {
  const d = document.createElement("div");
  d.className = `msg ${cls}`;
  d.innerHTML = html;
  $("#log").appendChild(d);
  d.scrollIntoView({ behavior: "smooth", block: "end" });
  return d;
}

async function ask(question) {
  add("user", esc(question));
  const bot = add("bot", '<span class="meta">Thinking…</span>');
  $("#send").disabled = true;
  const doc_ids = [...document.querySelectorAll("#docs input:checked")].map((i) => i.value);
  try {
    const r = await api("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, doc_ids: doc_ids.length ? doc_ids : null }),
    });
    bot.innerHTML = renderAnswer(r);
  } catch (e) {
    bot.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  } finally {
    $("#send").disabled = false;
  }
}

$("#ask").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = $("#q").value.trim();
  if (q) { $("#q").value = ""; ask(q); }
});
$("#log").addEventListener("click", (e) => { const q = e.target.dataset?.q; if (q) ask(q); });
$("#docs").addEventListener("click", async (e) => {
  const id = e.target.dataset?.del;
  if (!id) return;
  await api(`/documents/${id}`, { method: "DELETE" });
  loadDocs(); loadStatus();
});
const drop = $("#drop");
drop.addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", (e) => upload(e.target.files));
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); upload(e.dataTransfer.files); });

loadStatus(); loadDocs();
</script>
</body>
</html>
